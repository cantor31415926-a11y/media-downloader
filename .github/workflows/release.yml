name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build MediaDownloader.exe
        run: python -m PyInstaller --noconfirm --clean MediaDownloader.spec

      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path dist\MediaDownloader.exe -DestinationPath dist\MediaDownloader-Windows-x64.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist\MediaDownloader-Windows-x64.zip --generate-notes --title "Media Downloader ${{ github.ref_name }}"
